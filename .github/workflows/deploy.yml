name: Deploy to AWS ECS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  AI_AGENT_REPO: coleren-ai-agent
  BACKEND_REPO: coleren-backend
  ECS_CLUSTER: coleren-cluster
  AI_AGENT_SERVICE: coleren-ai-agent-service
  BACKEND_SERVICE: coleren-backend-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ai-agent
        working-directory: ai-agent
        run: |
          docker build -t $ECR_REGISTRY/$AI_AGENT_REPO:latest .
          docker push $ECR_REGISTRY/$AI_AGENT_REPO:latest

      - name: Build and push backend
        working-directory: coleren-backend
        run: |
          docker build -t $ECR_REGISTRY/$BACKEND_REPO:latest .
          docker push $ECR_REGISTRY/$BACKEND_REPO:latest

      - name: Force new ECS deployment — ai-agent
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $AI_AGENT_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Force new ECS deployment — backend
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $BACKEND_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION
